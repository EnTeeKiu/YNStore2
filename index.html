<!DOCTYPE html>
<html lang=" en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <title>FORM LOGIN CUA YN</title>
</head>

<body>
    <div id="wrapper">
        <form action="" id="form-login">
            <h1 class="form-heading">ĐĂNG NHẬP</h1>
            <div class="form-group">
                <i class="fa-solid fa-user" style="color: #ff8fd0;"></i>
                <input type="text" class="form-input" placeholder="Username">
            </div>
            <div class="form-group">
                <i class="fa-solid fa-key" style="color: #ff8fd0;"></i>
                <input type="password" class="form-input" placeholder="Password" id="password">
                <i class="fa-solid fa-eye" style="color: #ff8fd0; cursor: pointer;" id="eye"></i>
            </div>
            <input type="submit" value="Đăng Nhập" class="form-submit">
            <div class="text"
                style="justify-content: center; flex-direction: column; align-items: center; gap: 10px; margin-top: 20px;">
                <a href="register.html" class="textf-link" style="color:#ff8fd0; text-decoration:none;">Chưa có tài
                    khoản ? Đăng ký</a>
                <a href="home.html" class="textf-link" style="color:#ff8fd0; text-decoration:none;">Quay về trang
                    chủ</a>
            </div>
        </form>
    </div>
</body>
<script src="https://code.jquery.com/jquery-4.0.0.js"></script>
<script src="app.js"></script>

</html>
