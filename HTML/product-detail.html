<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Chi tiết Sản phẩm - YN</title>
</head>

<body>
    <div class="navbar">
        <div class="nav-links">
            <a href="home.html">Dashboard</a>
            <a href="products.html">Quản lý sản phẩm</a>
            <a href="contact.html">Hỗ trợ Kỹ thuật</a>
            <a href="index.html">Đăng xuất</a>
        </div>
    </div>
    <div id="wrapper">
        <div class="page-content">
            <form action="" id="form-edit-product" style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
                <h1 class="form-heading" style="text-align: center; color: #ff8fd0; margin-bottom: 20px;">Chỉnh sửa Sản phẩm</h1>
                <div style="text-align: center; margin-bottom: 20px;">
                    <img src="../Product Image/croissant.jpg" alt="Preview" style="width: 200px; height: 200px; object-fit: cover; border-radius: 10px; border: 2px solid #ff8fd0;">
                </div>
                <div class="form-group" style="border-bottom: 1px solid #ff8fd0; margin-bottom: 15px; display: flex;">
                    <input type="text" class="form-input" placeholder="Tên sản phẩm" value="Smiling Croissant">
                </div>
                <div class="form-group" style="border-bottom: 1px solid #ff8fd0; margin-bottom: 15px; display: flex;">
                    <input type="text" class="form-input" placeholder="Giá" value="$24.99">
                </div>
                <div class="form-group" style="border-bottom: 1px solid #ff8fd0; margin-bottom: 15px; display: flex;">
                    <input type="text" class="form-input" placeholder="Hình ảnh URL" value="croissant.jpg">
                </div>
                <div class="form-group" style="border-bottom: 1px solid #ff8fd0; margin-bottom: 15px; display: flex;">
                    <textarea class="form-input" placeholder="Mô tả" style="resize:none; height: 80px; width: 100%;">A buttery soft friend to start your day.</textarea>
                </div>
                <input type="submit" value="Lưu thay đổi" class="form-submit" onclick="alert('Đã lưu thành công!'); window.location.href='products.html'; event.preventDefault();">
                <a href="products.html" class="form-submit" style="display:block; text-align:center; text-decoration:none; background-color: #ccc; border-color: #ccc; margin-top: 10px; color: #333;">Hủy bỏ</a>
            </form>
        </div>
    </div>
</body>

</html>
