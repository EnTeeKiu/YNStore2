<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <title>Liên hệ - YN</title>
</head>

<body>
    <div class="navbar">
        <div class="nav-links">
            <a href="home.html">Dashboard</a>
            <a href="products.html">Quản lý sản phẩm</a>
            <a href="contact.html">Hỗ trợ Kỹ thuật</a>
            <a href="index.html">Đăng xuất</a>
        </div>
    </div>
    <div id="wrapper">
        <form action="" id="form-contact">
            <h1 class="form-heading">HỖ TRỢ KỸ THUẬT</h1>
            <div style="text-align: center; color: #ff8fd0; margin-bottom: 20px; line-height: 1.6;">
                <p style="font-weight: bold; margin-bottom: 5px;">Thông tin liên hệ IT:</p>
                <p><i class="fa-solid fa-user"></i> Trương Thị Yến Nhi</p>
                <p><i class="fa-solid fa-phone"></i> 0373607007</p>
                <p><i class="fa-solid fa-envelope"></i> yuiyuiisama@gmail.com</p>
            </div>
            <p style="text-align: center; color: #ff8fd0; margin-bottom: 20px;">Gửi yêu cầu hỗ trợ hệ thống:</p>
            <div class="form-group" style="justify-content: center; border: none; margin: 5px;">
                <input type="text" class="form-input" placeholder="Họ và tên" id="contact-name"
                    style="border: 1px solid #ff8fd0; border-radius: 10px; padding: 10px;">
            </div>
            <div class="form-group" style="justify-content: center; border: none; margin: 5px;">
                <input type="email" class="form-input" placeholder="Email" id="contact-email"
                    style="border: 1px solid #ff8fd0; border-radius: 10px; padding: 10px;">
            </div>
            <div class="form-group" style="justify-content: center; border: none; margin: 5px;">
                <textarea class="form-input" placeholder="Tin nhắn" id="contact-message"
                    style="border: 1px solid #ff8fd0; border-radius: 10px; padding: 10px; height: 100px; resize:none;"></textarea>
            </div>
            <input type="submit" value="Gửi tin nhắn" class="form-submit"
                onclick="alert('Cảm ơn bạn đã liên hệ!'); event.preventDefault();">
        </form>
    </div>
</body>

</html>
